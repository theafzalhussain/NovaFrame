<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080706" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Afzal Hussain — WebXstudio" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <!-- Fonts are self-hosted (see src/index.css). Preloading the four faces used above the fold
         lets them arrive in parallel with the app code instead of being discovered after it runs. -->
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-italic-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Tech-stack logos (devicon) are served from jsDelivr on the pages that show them -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!--
      Everything between the markers below is replaced per request by server/seo.ts, which
      resolves this page's title, description, canonical URL, social cards and JSON-LD from
      the live content (see src/lib/seo.ts). The values left here are the home-page defaults
      and are what you see when the HTML is served without the Node server in front of it
      (`vite dev`, or a purely static host).

      Do not remove the markers, and keep this block limited to tags the SEO layer owns.
    -->
    <!-- seo:start -->
    <title>Web Development Company in New Delhi — Websites, Apps & PWAs | WebXstudio</title>
    <meta
      name="description"
      content="WebXstudio builds fast websites, web apps, online stores and PWAs on React, Next.js and Node.js. Five live products you can open today. Free quote within 12 hours."
    />
    <link rel="canonical" href="https://webxstudio.me/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta property="og:site_name" content="WebXstudio" />
    <meta property="og:title" content="Web Development Company in New Delhi — Websites, Apps & PWAs" />
    <meta
      property="og:description"
      content="Websites, web apps, online stores and PWAs — designed with restraint and engineered on React, Next.js and Node.js. Five live products you can open today."
    />
    <meta property="og:url" content="https://webxstudio.me/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://webxstudio.me/brand/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Web Development Company in New Delhi — Websites, Apps & PWAs" />
    <meta
      name="twitter:description"
      content="Websites, web apps, online stores and PWAs, engineered on React, Next.js and Node.js. Five live products you can open today."
    />
    <meta name="twitter:image" content="https://webxstudio.me/brand/logo.png" />
    <!-- seo:end -->

    <script>
      // If a cached copy of this page points at script/style files a newer deploy has replaced,
      // reload once so the visitor gets the current build instead of a blank screen.
      addEventListener(
        "error",
        function (e) {
          var t = e.target;
          var url = t && (t.src || t.href);
          if (!url || !/\/assets\//.test(url) || !(t.tagName === "SCRIPT" || t.tagName === "LINK")) return;
          try {
            if (!navigator.onLine || sessionStorage.getItem("wx_asset_reload")) return;
            sessionStorage.setItem("wx_asset_reload", "1");
          } catch (_) {
            return;
          }
          location.reload();
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
