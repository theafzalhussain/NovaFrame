    <!-- Tech-stack logos (devicon) are served from jsDelivr on the pages that show them -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <script>
      // If a cached copy of this page points at script/style files a newer deploy has replaced,
      // reload once so the visitor gets the current build instead of a blank screen.
      addEventListener(
        "error",
        function (e) {
          var t = e.target;
          var url = t && (t.src || t.href);
          if (!url || !/\/assets\//.test(url) || !(t.tagName === "SCRIPT" || t.tagName === "LINK")) return;
          try {
            if (!navigator.onLine || sessionStorage.getItem("nf_asset_reload")) return;
            sessionStorage.setItem("nf_asset_reload", "1");
          } catch (_) {
            return;
          }
          location.reload();
        },
        true,
      );
    </script>
