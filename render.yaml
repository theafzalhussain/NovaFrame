# Render blueprint — one Node web service that builds the site and serves it + the /api backend.
# Render reads this automatically when you create a "Blueprint" from the repo.
# Secrets (Turso token, mail, Razorpay, admin password) are NOT put here —
# add them in the dashboard (Environment tab). sync: false means "ask me".
#
# Data lives in Turso (hosted libSQL), so this service needs no persistent
# disk and the database survives every restart, redeploy and free-tier sleep.
services:
  - type: web
    name: novaframe
    runtime: node
    plan: free
    region: singapore # closest to India; change if you prefer
    branch: main
    # devDependencies are needed: the build runs Vite and the server runs through tsx.
    buildCommand: npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # --- Database (Turso) — required ---
      - key: TURSO_DATABASE_URL
        sync: false # libsql://<your-db>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: TZ_OFFSET_MINUTES
        value: "330"
      - key: PAYMENT_CURRENCY
        value: INR
      - key: SEND_CONFIRMATIONS
        value: "true"
      # --- Set these in the Render dashboard (Environment tab), not here ---
      # ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_NAME
      # BREVO_API_KEY (or RESEND_API_KEY / SMTP_*), MAIL_FROM, NOTIFY_EMAIL
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET
      # CORS_ORIGIN, SITE_URL
